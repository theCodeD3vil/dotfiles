# Only settings that differ from topgrade's defaults; `topgrade --help` lists step names.
[misc]
pre_sudo = true
show_skipped = true
cleanup = true
notify_end = "on_failure"
only = [
    "brew_formula",
    "brew_cask",
    "shell",  # oh-my-zsh
    "yazi",
    "claude_code",
    "claude_code_plugins",
    "cursor_agent",
    "pi",
]

[brew]
greedy_cask = true
autoremove = true
