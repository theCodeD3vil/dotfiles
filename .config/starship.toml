# *****************************************************************************
# STARSHIP.TOML
# *****************************************************************************

# *****************************************************************************
# GENERAL
# *****************************************************************************

#-------------------------------------------------------
# PROMPT LAYOUT
#-------------------------------------------------------
# One sentence, then the input on its own line:
#   ┳━ <status icon> folder via <tool> on <github> branch ● +added -removed took 3.2s
#   ┗━
# The status icon is green after a passing command and red after a failing one.
# Only one tool shows, whichever the folder uses. Every module carries its own
# leading label ("via", "on", "took"), so a missing module leaves no gap.
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[┳━ ](fg:color_line)\
$status\
$directory\
$c\
$cpp\
$rust\
$golang\
$bun\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$git_branch\
${custom.git_dirty}\
$git_metrics\
$cmd_duration\
$line_break\
[┃](fg:color_line)\
$line_break\
$character"""

#-------------------------------------------------------
# PALETTE SELECTION
#-------------------------------------------------------
palette = 'catppuccin_mocha'

# *****************************************************************************
# THEME — VIRA DEEPFOREST PALETTE
# *****************************************************************************

# Catppuccin Mocha (catppuccin/starship), under the names the modules use.
[palettes.catppuccin_mocha]
color_fg0 = '#11111b'
color_fg_light = '#cdd6f4'
color_bg1 = '#313244'
color_green = '#a6e3a1'
color_grey = '#7f849c'
color_pink = '#f5c2e7'
color_orange = '#fab387'
color_red = '#f38ba8'
color_yellow = '#f9e2af'
color_tool = '#94e2d5'
color_line = '#6c7086'

[palettes.vira_deepforest]
color_fg0 = '#080c0b'
color_fg_light = '#CAE5D5'
color_bg1 = '#212f2b'
color_green = '#C3E88D'
color_grey = '#64746b'
color_pink = '#CB7FA3'
color_orange = '#DF9877'
color_red = '#f07178'
color_yellow = '#FFCB6B'
# Tool versions: the mid green between Deepforest's ANSI green and the
# connector green.
color_tool = '#7baf69'
# Prompt connector: the green Deepforest uses for text selection.
color_line = '#4B7253'

# *****************************************************************************
# STATUS ICON — LAST COMMAND STATUS
# *****************************************************************************

# Every kind of failure (exit code, not found, not executable, Ctrl-C, signal)
# draws the same red icon.
[status]
disabled = false
format = '$symbol'
success_symbol = '[ ](fg:color_green)'
symbol = '[ ](fg:color_red)'
not_executable_symbol = '[ ](fg:color_red)'
not_found_symbol = '[ ](fg:color_red)'
sigint_symbol = '[ ](fg:color_red)'
signal_symbol = '[ ](fg:color_red)'

# *****************************************************************************
# FOLDER
# *****************************************************************************

[directory]
# Same pill as the tmux folder pill: green icon tab, dark label, rounded ends.
style = "fg:color_fg_light bg:color_bg1"
read_only_style = "fg:color_red bg:color_bg1"
format = "[](fg:color_green)[ ](fg:color_fg0 bg:color_green)[ $path]($style)[$read_only]($read_only_style)[](fg:color_bg1)"
truncation_length = 1
truncate_to_repo = false

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

# *****************************************************************************
# TOOL — ONE SLOT, WHICHEVER THE FOLDER USES
# *****************************************************************************

[c]
symbol = ""
format = '[ via ](fg:color_grey)[$symbol $version](fg:color_tool)'

[cpp]
symbol = ""
format = '[ via ](fg:color_grey)[$symbol $version](fg:color_tool)'

[rust]
symbol = ""
format = '[ via ](fg:color_grey)[$symbol $version](fg:color_tool)'

[golang]
symbol = ""
format = '[ via ](fg:color_grey)[$symbol $version](fg:color_tool)'

[bun]
symbol = ""
format = '[ via ](fg:color_grey)[$symbol $version](fg:color_tool)'

# A Bun project also has a package.json, so Node steps aside when a Bun
# lockfile or config is present.
[nodejs]
symbol = ""
format = '[ via ](fg:color_grey)[$symbol $version](fg:color_tool)'
detect_files = ["package.json", ".node-version", ".nvmrc", "!bun.lock", "!bun.lockb", "!bunfig.toml"]

[php]
symbol = ""
format = '[ via ](fg:color_grey)[$symbol $version](fg:color_tool)'

[java]
symbol = ""
format = '[ via ](fg:color_grey)[$symbol $version](fg:color_tool)'

[kotlin]
symbol = ""
format = '[ via ](fg:color_grey)[$symbol $version](fg:color_tool)'

[haskell]
symbol = ""
format = '[ via ](fg:color_grey)[$symbol $version](fg:color_tool)'

[python]
symbol = ""
format = '[ via ](fg:color_grey)[$symbol $version](fg:color_tool)'

# *****************************************************************************
# GIT — BRANCH, CHANGES, LINES ADDED / REMOVED
# *****************************************************************************

[git_branch]
symbol = ""
format = '[ on ](fg:color_grey)[$symbol $branch](fg:color_orange)'

# One dot for any uncommitted change, untracked files included.
[custom.git_dirty]
when = 'test -n "$(git status --porcelain 2>/dev/null | head -n 1)"'
require_repo = true
shell = ["sh"]
format = '[ ●](fg:color_orange)'

[git_metrics]
disabled = false
format = '( [+$added](fg:color_green))( [-$deleted](fg:color_red))'

[cmd_duration]
min_time = 500
format = '[ took ](fg:color_grey)[$duration](bold fg:color_yellow)'

# *****************************************************************************
# INPUT LINE
# *****************************************************************************

[line_break]
disabled = false

[character]
success_symbol = '[┗━](fg:color_line)[](fg:color_green)'
error_symbol = '[┗━](fg:color_line)[](fg:color_green)'
vimcmd_symbol = '[┗━](fg:color_green)[](fg:color_green)'
vimcmd_replace_one_symbol = '[┗━](fg:color_pink)[](fg:color_pink)'
vimcmd_replace_symbol = '[┗━](fg:color_pink)[](fg:color_pink)'
vimcmd_visual_symbol = '[┗━](fg:color_yellow)[](fg:color_yellow)'
