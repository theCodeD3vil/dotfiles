# *****************************************************************************
# STARSHIP.TOML
# *****************************************************************************

# *****************************************************************************
# GENERAL
# *****************************************************************************

#-------------------------------------------------------
# PROMPT LAYOUT
#-------------------------------------------------------
# pill order, left to right: os/shell/sudo -> language & runtime versions
# -> docker/conda/pixi -> folder icon + directory, then a line break and
# the prompt character. The pills are four shades of Deepforest green, from
# its brightest on the left to the darkest on the right; the prompt character
# is the same bright green, and red is reserved for a failed command.
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[╭─](fg:color_line)\
[](color_pill_os)\
$os\
$shell\
$sudo\
[](bg:color_pill_lang fg:color_pill_os)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:color_pill_lang bg:color_pill_env)\
$docker_context\
$conda\
$pixi\
[](fg:color_pill_env bg:color_pill_dir)\
$directory\
[](fg:color_pill_dir)\
$line_break[ ](fg:color_line)$line_break$character"""

right_format = """$git_branch$cmd_duration"""

#-------------------------------------------------------
# PALETTE SELECTION
#-------------------------------------------------------
palette = 'vira_deepforest'

# *****************************************************************************
# THEME — VIRA DEEPFOREST PALETTE
# *****************************************************************************

[palettes.vira_deepforest]
color_fg0 = '#080c0b'
color_fg_light = '#CAE5D5'
color_bg1 = '#212f2b'
color_green = '#C3E88D'
color_grey = '#64746b'
color_purple = '#A68DCD'
color_red = '#f07178'
color_yellow = '#FFCB6B'
# Pill shades, left to right from Deepforest's brightest green (#C3E88D, its ANSI
# green) down to a deep forest green. The first two pills take dark text
# (color_fg0), the last two light text (color_fg_light), and every pill keeps at
# least 4.7:1 contrast with its text. Neighbours differ by roughly 1.9:1 to 2.5:1.
color_pill_os = '#C3E88D'
color_pill_lang = '#7baf69'
color_pill_env = '#3b6a48'
color_pill_dir = '#234632'
# Prompt connectors: the green Deepforest uses for text selection.
color_line = '#4B7253'

# *****************************************************************************
# LEFT PILL — OS / SHELL / SUDO
# *****************************************************************************

[os]
disabled = false
style = "bg:color_pill_os fg:color_fg0"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[shell]
disabled = false
style = "bg:color_pill_os fg:color_fg0"
format = '[ $indicator ]($style)'
zsh_indicator = "zsh"
bash_indicator = "bash"
fish_indicator = "fish"
powershell_indicator = "pwsh"
unknown_indicator = "shell"

[sudo]
disabled = false
symbol = "󰒃"
style = "bg:color_pill_os fg:color_fg0"
format = '[ $symbol ]($style)'

# *****************************************************************************
# LANGUAGE & RUNTIME VERSIONS
# *****************************************************************************

[nodejs]
symbol = ""
style = "bg:color_pill_lang"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_pill_lang)]($style)'

[bun]
symbol = ""
style = "bg:color_pill_lang"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_pill_lang)]($style)'

[c]
symbol = " "
style = "bg:color_pill_lang"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_pill_lang)]($style)'

[cpp]
symbol = " "
style = "bg:color_pill_lang"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_pill_lang)]($style)'

[rust]
symbol = ""
style = "bg:color_pill_lang"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_pill_lang)]($style)'

[golang]
symbol = ""
style = "bg:color_pill_lang"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_pill_lang)]($style)'

[php]
symbol = ""
style = "bg:color_pill_lang"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_pill_lang)]($style)'

[java]
symbol = ""
style = "bg:color_pill_lang"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_pill_lang)]($style)'

[kotlin]
symbol = ""
style = "bg:color_pill_lang"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_pill_lang)]($style)'

[haskell]
symbol = ""
style = "bg:color_pill_lang"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_pill_lang)]($style)'

[python]
symbol = ""
style = "bg:color_pill_lang"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_pill_lang)]($style)'

# *****************************************************************************
# ENVIRONMENT — DOCKER / CONDA / PIXI
# *****************************************************************************

[docker_context]
symbol = ""
style = "bg:color_pill_env"
format = '[[ $symbol( $context) ](fg:color_fg_light bg:color_pill_env)]($style)'

[conda]
style = "bg:color_pill_env"
format = '[[ $symbol( $environment) ](fg:color_fg_light bg:color_pill_env)]($style)'

[pixi]
style = "bg:color_pill_env"
format = '[[ $symbol( $version)( $environment) ](fg:color_fg_light bg:color_pill_env)]($style)'

# *****************************************************************************
# DIRECTORY PILL
# *****************************************************************************

[directory]
style = "fg:color_fg_light bg:color_pill_dir"
format = "[ 󰉋 $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

# *****************************************************************************
# RIGHT PROMPT — GIT BRANCH / CMD DURATION
# *****************************************************************************

[git_branch]
symbol = " "
style = "fg:color_grey"
format = '[$symbol$branch]($style) '

[cmd_duration]
min_time = 500
style = "fg:color_green"
format = '[󱦟 $duration]($style)'

# *****************************************************************************
# PROMPT CHARACTER
# *****************************************************************************

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[╰─](bold fg:color_green)[](bold fg:color_green)'
error_symbol = '[╰─](bold fg:color_red)[](bold fg:color_red)'
vimcmd_symbol = '[╰─](bold fg:color_green)[](bold fg:color_green)'
vimcmd_replace_one_symbol = '[╰─](bold fg:color_purple)[](bold fg:color_purple)'
vimcmd_replace_symbol = '[╰─](bold fg:color_purple)[](bold fg:color_purple)'
vimcmd_visual_symbol = '[╰─](bold fg:color_yellow)[](bold fg:color_yellow)'

