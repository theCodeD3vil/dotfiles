# Only settings that differ from atuin's defaults; `atuin default-config` lists the rest.
workspaces = true
inline_height = 20
enter_accept = true
search_mode = "daemon-fuzzy"

[daemon]
enabled = true
autostart = true

[theme]
name = "vira-deepforest"

[search]
filters = ["workspace", "global"]

[tmux]
enabled = true

[ai]
enabled = true
model = "balanced"

[ai.opening]
send_last_command = true
