[metadata]
name = "git-worktrees"
description = "List and switch between git worktrees"
requirements = ["git"]

[source]
command = "git worktree list --porcelain | grep '^worktree' | cut -d' ' -f2-"

[preview]
command = "cd '{}' && git log --oneline -10 --color=always && echo && git status --short"

[keybindings]
enter = "actions:cd"
ctrl-d = ["actions:remove", "reload_source"]

[actions.cd]
description = "Change to the selected worktree"
command = "cd {} && $SHELL"
mode = "execute"

[actions.remove]
description = "Remove the selected worktree via worktrunk (runs hooks, deletes branch if merged)"
command = "wt remove --foreground '{}'"
mode = "execute"
