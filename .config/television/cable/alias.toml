[metadata]
name = "alias"
description = "Browse custom aliases and shell functions defined in .zshrc"
requirements = ["awk", "bat"]

[source]
command = '''
awk '
  function shq(s,    sq, bs) {
    sq = sprintf("%c", 39)
    bs = sprintf("%c", 92)
    gsub(sq, sq bs sq sq, s)
    return s
  }
  /^#/ {
    line = $0
    sub(/^# ?/, "", line)
    cbuf = (cbuf == "") ? line : cbuf " " line
    next
  }
  /^alias [a-zA-Z_][a-zA-Z0-9_]*=/ {
    name = $0
    sub(/^alias /, "", name)
    sub(/=.*/, "", name)
    if (name ~ /^(ls|cd)$/) { cbuf = ""; next }
    printf "%d\t%s\talias\t%s\t%d\n", NR, name, shq(cbuf), NR
    cbuf = ""
    next
  }
  /^[a-zA-Z_][a-zA-Z0-9_]*\(\)/ {
    name = $0
    sub(/\(\).*/, "", name)
    if (name ~ /^(chpwd|_fzf_compgen_path|_fzf_compgen_dir|_fzf_comprun)$/) { cbuf = ""; next }
    # find the matching closing brace by counting braces line by line
    startline = NR
    depth = 0
    n = length($0)
    for (i = 1; i <= n; i++) {
      ch = substr($0, i, 1)
      if (ch == "{") depth++
      else if (ch == "}") depth--
    }
    endline = NR
    while (depth > 0 && (getline more) > 0) {
      endline++
      n2 = length(more)
      for (i = 1; i <= n2; i++) {
        ch = substr(more, i, 1)
        if (ch == "{") depth++
        else if (ch == "}") depth--
      }
    }
    printf "%d\t%s\tfunction\t%s\t%d\n", startline, name, shq(cbuf), endline
    cbuf = ""
    next
  }
  { cbuf = "" }
' "$HOME/.zshrc"
'''
display = "{split:\t:1}  ({split:\t:2})"
output = "{split:\t:1}"

[preview]
command = '''
desc='{split:\t:3}'
[ -n "$desc" ] && printf "\033[1;36m%s\033[0m\n\n" "$desc"
bat -n --color=always --line-range "{split:\t:0}:{split:\t:4}" "$HOME/.zshrc"
'''

[ui]
preview_panel = { header = "{split:\t:1}  ({split:\t:2})" }

[keybindings]
enter = "actions:run"

[actions.run]
description = "Run the selected alias/function"
command = "zsh -c 'source \"$HOME/.zshrc\" >/dev/null 2>&1; {split:\t:1}'"
mode = "execute"

[actions.edit]
description = "Open .zshrc in editor at this definition"
command = "${EDITOR:-vim} '+{split:\t:0}' \"$HOME/.zshrc\""
shell = "bash"
mode = "execute"
