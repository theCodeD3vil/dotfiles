# *****************************************************************************
# THEME - CATPPUCCIN MOCHA
# *****************************************************************************
# The @thm_* palette comes from the catppuccin/tmux submodule. Everything reads
# colors as #{@thm_*} at render time, so nothing here depends on load order.
source-file ~/.config/tmux/plugins/catppuccin/tmux/themes/catppuccin_mocha_tmux.conf

#-------------------------------------------------------
# MESSAGES, MENUS, POPUPS, COPY MODE, CLOCK
#-------------------------------------------------------
set -gF message-style "fg=#{@thm_teal},bg=default,align=centre"
set -gF message-command-style "fg=#{@thm_teal},bg=default,align=centre"
set -gF menu-selected-style "fg=#{@thm_fg},bold,bg=#{@thm_overlay_0}"
# bg=default: the popup uses the terminal background, so Ghostty/WezTerm opacity and
# blur apply to it (an explicit bg would be opaque).
set -gF popup-style "bg=default,fg=#{@thm_fg}"
set -gF mode-style "fg=#{@thm_crust},bg=#{@thm_yellow},bold"
set -gF clock-mode-colour "#{@thm_blue}"

#-------------------------------------------------------
# SESSION ICON
#-------------------------------------------------------
# Session label icon = logo of the OS/distro tmux runs on (apple, windows,
# ubuntu, fedora, arch, ... or tux), from scripts/os-icon.sh. run-shell without
# -b blocks config parsing until its nested `tmux set` is done.
run-shell 'tmux set -g @session_icon "$(~/.config/tmux/scripts/os-icon.sh) "'
