# *****************************************************************************
# WINDOWS
# *****************************************************************************

#-------------------------------------------------------
# WINDOW LOOK AND FEEL
#-------------------------------------------------------
# Every window is its name in plain text on the terminal background, followed by
# its index in a pill that is flat on the left and rounded on the right (U+E0B4).
# The pill is green (dark text) for inactive windows and orange for the active
# one, whose name is also brighter and bold.
set -g window-status-format "#[fg=#{@thm_overlay_2},bg=terminal] #W #[fg=#{@thm_crust},bg=#{@thm_green}] #I #[fg=#{@thm_green},bg=terminal]\U0000E0B4"
set -g window-status-separator " "
# tmux's default for the current window is "underscore", which underlines the
# whole segment; the orange pill already marks it.
set -g window-status-current-style none
set -g window-status-current-format "#[fg=#{@thm_fg},bg=terminal,bold] #W #[fg=#{@thm_crust},bg=#{@thm_orange}] #I #[fg=#{@thm_orange},bg=terminal,nobold]\U0000E0B4"
