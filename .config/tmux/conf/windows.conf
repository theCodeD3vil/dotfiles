# *****************************************************************************
# WINDOWS
# *****************************************************************************

#-------------------------------------------------------
# WINDOW LOOK AND FEEL
#-------------------------------------------------------
# Inactive windows are plain muted text on the terminal background:
# window index + name.
# The active window is a solid teal segment (dark text) with trapezoid caps
# (U+E0D4 left, U+E0D2 right), which make it two cells wider than the others.
set -g window-status-format "#[fg=#{@thm_overlay_1},bg=terminal] #{?@busy,#[fg=#{@thm_teal}]#{@spin}#[fg=#{@thm_overlay_1}],#I} #[fg=#{@thm_overlay_2}]#W "
set -g window-status-separator " "
set -g window-status-current-format "#[fg=#{@thm_teal},bg=terminal]#[fg=#{@thm_crust},bg=#{@thm_teal},bold] #I #W #[fg=#{@thm_teal},bg=terminal,nobold]"

#-------------------------------------------------------
# BUSY SPINNER
#-------------------------------------------------------
# Inactive windows swap their index for a teal braille spinner while they are
# printing output (a download, a build, an agent working). scripts/spinner.sh sets
# @busy on those windows and keeps the current frame in @spin; it runs once per
# server (a reload starts a second copy that exits at once). Tunables are at the
# top of the script.
run-shell -b ~/.config/tmux/scripts/spinner.sh
