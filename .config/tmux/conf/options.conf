# *****************************************************************************
# OPTIONS
# *****************************************************************************

#-------------------------------------------------------
# CORE OPTIONS
#-------------------------------------------------------
set -g mouse on
set -g default-terminal "tmux-256color"
# truecolor for xterm-256color, xterm-ghostty, ... (reset first so reloads don't append duplicates)
set -su terminal-features
set -as terminal-features ',xterm*:RGB'
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g status-position top       # position
set -g set-clipboard on          # use system clipboard
set -g extended-keys on          # used by pi coding agent.
set -g focus-events on           # let nvim see focus in/out
set -g history-limit 50000
set -g display-time 4000         # status messages stay up 4s (default 0.75s)
set -g status-keys emacs         # command prompt (prefix + :) ignores $EDITOR
# Window list left-justified with a gap from status-left (session pill),
# instead of glued to it or dead-centered on the full status line.
set -g status-justify "left"

#-------------------------------------------------------
# RENAMING
#-------------------------------------------------------
set -g allow-rename off
# Claude Code's process title is its version (e.g. 2.1.277): show it as "claude".
# tmux's default format with #{pane_current_command} swapped for that check.
set -g automatic-rename-format "#{?pane_in_mode,[tmux],#{?#{m/r:^[0-9]+[.][0-9]+[.][0-9]+\$,#{pane_current_command}},claude,#{pane_current_command}}}#{?pane_dead,[dead],}"
