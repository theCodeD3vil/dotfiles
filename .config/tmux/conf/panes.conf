# *****************************************************************************
# PANES
# *****************************************************************************

# ACTIVE PANE
#-------------------------------------------------------
# The active pane is loud on three channels, so it reads at a glance:
#  - border: heavy teal line (inactive: heavy, near-invisible surface_0)
#  - label: bold teal text, no background; inactive is plain muted text
#  - text: inactive panes dim their default-colored text (colored output such
#    as nvim or syntax highlighting is untouched)
# Teal = "where you are", same as the active window. Colors are #{@thm_*}
# lookups; "#," is a literal comma inside the #{?pane_active,...} conditional.
setw -g pane-border-status top
setw -g pane-border-format "#{?pane_active,#[fg=#{@thm_teal}#,bold],#[fg=#{@thm_overlay_0}]} #I#{?#{!=:#{window_name},Window},: #W,} #[default]"
setw -g pane-active-border-style "bg=terminal,fg=#{@thm_teal}" # transparent background
setw -g pane-border-style "bg=terminal,fg=#{@thm_surface_0}"
setw -g pane-border-lines heavy
setw -gF window-style "fg=#{@thm_overlay_1}"
setw -g window-active-style "fg=default"

# POPUP LOOK AND FEEL (prefix + s sesh picker)
#-------------------------------------------------------
set -g popup-border-lines rounded
set -g popup-border-style "fg=#{@thm_mauve}"
