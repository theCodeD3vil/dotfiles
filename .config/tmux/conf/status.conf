# *****************************************************************************
# STATUS BAR LAYOUT
# *****************************************************************************

#-------------------------------------------------------
# PILLS
#-------------------------------------------------------
# One pill = accent-colored rounded cap + icon, then text on surface_0, then a
# closing cap. Only the accent, icon and text differ. Colors are #{@thm_*}
# lookups (theme.conf) resolved on every render, so file order doesn't matter.
%hidden PILL_TEXT="#[fg=#{@thm_fg},bg=#{@thm_surface_0}]"
%hidden PILL_END="#[fg=#{@thm_surface_0},bg=default]"
%hidden SESSION_PILL="#[fg=#{@thm_mauve},bg=default]#[fg=#{@thm_crust},bg=#{@thm_mauve}]#{@session_icon}${PILL_TEXT} #S${PILL_END}"
%hidden GIT_PILL="#[fg=#{@thm_teal},bg=default]#[fg=#{@thm_crust},bg=#{@thm_teal}]\U000F02A2 ${PILL_TEXT} #(gitmux -cfg ~/.gitmux.conf \"#{pane_current_path}\")${PILL_END}"
%hidden DIRECTORY_PILL="#[fg=#{@thm_lavender},bg=default]#[fg=#{@thm_crust},bg=#{@thm_lavender}] ${PILL_TEXT} #{b:pane_current_path}${PILL_END}"

# Gap between the pills and the window list.
%hidden GAP="   "

#-------------------------------------------------------
# LEFT / RIGHT
#-------------------------------------------------------
set -g status-interval 5   # how often the git pill (gitmux) refreshes
set -g status-left-length 50
set -g status-left "${SESSION_PILL}${GAP}"
set -g status-right-length 120
set -g status-right "${GAP}${GIT_PILL} ${DIRECTORY_PILL}"

#-------------------------------------------------------
# WINDOW LIST OVERFLOW MARKERS
#-------------------------------------------------------
# Pad the "<"/">" markers away from the clipped window next to them. tmux has
# no option for this: the markers are hard-coded in status-format[0], so patch
# tmux's own default in place instead of keeping a copy of it. -F bakes the
# result once at load; on reload the pattern (. = the literal brackets) no
# longer matches, so the spaces don't stack.
set -gF status-format[0] "#{s/<#.list=right-marker.>/< #[list=right-marker] >/:status-format[0]}"

#-------------------------------------------------------
# STYLE
#-------------------------------------------------------
# fg here also tints the "<"/">" window-list overflow markers - tmux has
# no dedicated option for them, they inherit status-style's fg.
set -g status-style "bg=terminal,fg=#{@thm_overlay_0}"
