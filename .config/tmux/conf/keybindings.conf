# *****************************************************************************
# KEYBINDINGS
# *****************************************************************************

unbind r
bind r source-file ~/.config/tmux/tmux.conf

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# sesh picker: prefix + s opens television's sesh channel in a popup
# (replaces the default choose-tree). -E closes the popup once tv exits,
# which happens after `sesh connect` switches the client.
bind-key s display-popup -E -w 80% -h 70% -T " sesh " "tv sesh"
