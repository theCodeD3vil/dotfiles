# *****************************************************************************
# TMUX.CONF
# *****************************************************************************
# Entry point only: settings live in conf/*.conf. Colors are read at render
# time, so the order below is grouping, not a dependency.

source-file ~/.config/tmux/conf/options.conf
source-file ~/.config/tmux/conf/keybindings.conf
source-file ~/.config/tmux/conf/theme.conf
source-file ~/.config/tmux/conf/status.conf
source-file ~/.config/tmux/conf/windows.conf
source-file ~/.config/tmux/conf/panes.conf
