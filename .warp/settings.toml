[terminal]

[terminal.input]
input_box_type_setting = "classic"
honor_ps1 = true

[agents]
cloud_conversation_storage_enabled = true

[agents.warp_agent]

[agents.warp_agent.input]
nld_in_terminal_enabled = true
ai_auto_detection_enabled = true

[agents.execution_profiles]

[agents.execution_profiles.default]
apply_code_diffs = "agent_decides"
ask_user_question = "always_ask"
autosync_plans_to_warp_drive = true
command_allowlist = []
command_denylist = [
  'bash(\s.*)?',
  'fish(\s.*)?',
  'pwsh(\s.*)?',
  'sh(\s.*)?',
  'zsh(\s.*)?',
  'curl(\s.*)?',
  'eval(\s.*)?',
  'exec(\s.*)?',
  'source(\s.*)?',
  'wget(\s.*)?',
  'dig(\s.*)?',
  'nslookup(\s.*)?',
  'host(\s.*)?',
  'ssh(\s.*)?',
  'scp(\s.*)?',
  'rsync(\s.*)?',
  'telnet(\s.*)?',
  'rm(\s.*)?',
]
computer_use = "never"
directory_allowlist = []
execute_commands = "agent_decides"
mcp_allowlist = []
mcp_denylist = []
mcp_permissions = "agent_decides"
name = "Default"
read_files = "agent_decides"
run_agents = "always_ask"
web_search_enabled = true
write_to_pty = "always_ask"

[account]
is_settings_sync_enabled = true

[privacy]
crash_reporting_enabled = true
telemetry_enabled = true

[appearance]

[appearance.icon]
app_icon = "aurora"

[appearance.text]
notebook_font_size = 14.0
font_size = 16.0
font_name = "CaskaydiaCove Nerd Font Mono"
ai_font_name = "Cartograph CF"
match_ai_font = false
ligature_rendering_enabled = true

[appearance.input]
input_mode = "waterfall"

[appearance.panes]
should_dim_inactive_panes = true

[appearance.cursor]
cursor_display_type = "block"

[appearance.themes.theme.custom]
name = "Vira-Theme-Deepforest"
path = "~/.warp/themes/Vira-Theme-Deepforest.yaml"

[notifications]
toast_duration_secs = 8

[general]
login_item = false
